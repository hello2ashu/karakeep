services:
  web:
    image: ghcr.io/karakeep-app/karakeep:latest
    restart: unless-stopped
    volumes:
      # By default, the data is stored in a docker volume called "data".
      # If you want to mount a custom directory, change the volume mapping to:
      # - /path/to/your/directory:/data
      - /volume1/docker/karakeep/data:/data
    ports:
      - 3000:3000
    environment:
      - KARAKEEP_VERSION=release
      - NEXTAUTH_SECRET=${karanextauth}
      - MEILI_MASTER_KEY=${karameili}
      - NEXTAUTH_URL=http://192.168.189.40:3000
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=https://ollama.ashish-syn-nas.synology.me:11434
      - INFERENCE_TEXT_MODEL=gemma3
      - INFERENCE_IMAGE_MODEL=llava
      - EMBEDDING_TEXT_MODEL=embeddinggemma
      - EMBEDDING_DIMENSIONS=768
      - EMBEDDING_CONTEXT_LENGTH=2048
      - INFERENCE_OUTPUT_SCHEMA=plain
      - MEILI_ADDR: http://meilisearch:7700
      - BROWSER_WEB_URL: http://chrome:9222

      # You almost never want to change the value of the DATA_DIR variable.
      # If you want to mount a custom directory, change the volume mapping above instead.
      DATA_DIR: /data # DON'T CHANGE THIS
  chrome:
    image: zenika/alpine-chrome:latest
    restart: unless-stopped
    command:
      - --no-sandbox
      - --disable-gpu
      - --disable-dev-shm-usage
      - --remote-debugging-address=0.0.0.0
      - --remote-debugging-port=9222
      - --hide-scrollbars
  meilisearch:
    image: getmeili/meilisearch:v1.53.1
    restart: unless-stopped
    environment:
      - KARAKEEP_VERSION=release
      - NEXTAUTH_SECRET=${karanextauth}
      - MEILI_MASTER_KEY=${karameili}
      - NEXTAUTH_URL=http://192.168.189.40:3000
      - OPENAI_API_KEY=ollama
      - OPENAI_BASE_URL=https://ollama.ashish-syn-nas.synology.me:11434
      - INFERENCE_TEXT_MODEL=gemma3
      - INFERENCE_IMAGE_MODEL=llava
      - EMBEDDING_TEXT_MODEL=embeddinggemma
      - EMBEDDING_DIMENSIONS=768
      - EMBEDDING_CONTEXT_LENGTH=2048
      - INFERENCE_OUTPUT_SCHEMA=plain
      - MEILI_ADDR: http://meilisearch:7700
      - BROWSER_WEB_URL: http://chrome:9222
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - /volume1/docker/karakeep/meilisearch:/meili_data

volumes:
  meilisearch:
  data:
